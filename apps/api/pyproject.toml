[project]
name = "reviewflow-api"
version = "0.1.0"
description = "ReviewFlow HTTP API"
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.116.1,<1.0",
    "pydantic-settings>=2.10.1,<3.0",
    "uvicorn>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3.0",
    "mypy>=1.17.0,<2.0",
    "pytest>=8.4.1,<10.0",
    "ruff>=0.12.5,<1.0",
]

[tool.uv]
package = false
required-version = "==0.12.9"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]
