name: reviewflow

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: reviewflow
      POSTGRES_PASSWORD: reviewflow-local-only
      POSTGRES_USER: reviewflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reviewflow-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewflow -d reviewflow"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  reviewflow-postgres-data:
