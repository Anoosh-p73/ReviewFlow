name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reviewflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning:
    name: Repository planning and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate planning documents and repository hygiene
        shell: pwsh
        run: ./scripts/validate-planning.ps1

  api-quality:
    name: API lint, types, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm and Node.js command runner
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: "11.19.0"
          runtime: node@24.20.0
          install: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install the pinned Python runtime
        run: uv python install 3.14.7

      - name: Install API dependencies from the lockfile
        run: uv --directory apps/api sync --locked --all-groups

      - name: Run Ruff lint and formatting checks
        run: pnpm lint:api

      - name: Run strict mypy
        run: pnpm typecheck:api

      - name: Run API unit tests
        run: pnpm test:api:unit

  web-quality:
    name: Web lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: "11.19.0"
          runtime: node@24.20.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install web dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint:web

      - name: Check Prettier formatting
        run: pnpm format:check

      - name: Run TypeScript type checking
        run: pnpm typecheck:web

      - name: Run Vitest
        run: pnpm test:web

      - name: Build the Next.js application
        run: pnpm build:web

  postgres-integration:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVIEWFLOW_DATABASE_URL: postgresql+psycopg://reviewflow:reviewflow-ci-only@127.0.0.1:5432/reviewflow_test
      REVIEWFLOW_TEST_DATABASE_URL: postgresql+psycopg://reviewflow:reviewflow-ci-only@127.0.0.1:5432/reviewflow_test

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: reviewflow_test
          POSTGRES_PASSWORD: reviewflow-ci-only
          POSTGRES_USER: reviewflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewflow -d reviewflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm and Node.js command runner
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: "11.19.0"
          runtime: node@24.20.0
          install: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install the pinned Python runtime
        run: uv python install 3.14.7

      - name: Install API dependencies from the lockfile
        run: uv --directory apps/api sync --locked --all-groups

      - name: Apply Alembic migrations
        run: pnpm db:migrate

      - name: Report the current migration revision
        run: pnpm db:current

      - name: Run PostgreSQL integration tests
        run: pnpm test:api:integration
